name: audio-discover
on: workflow_dispatch
jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - name: Arabic voices detail
        run: |
          for r in vadimbelsky/arabic-emirati-female-piper csukuangfj/vits-piper-ar_JO-SA_dii-high; do echo "== $r"; curl -s "https://huggingface.co/api/models/$r" | python3 -c "import json,sys;m=json.load(sys.stdin);print(m.get('cardData'));[print(' ',s['rfilename']) for s in m.get('siblings',[])]"; curl -s "https://huggingface.co/$r/raw/main/README.md" | head -40; done
      - name: Freesound page shape
        run: |
          curl -sL -A "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/120 Safari/537.36" -o fs.html -w "%{http_code} %{size_download}\n" "https://freesound.org/search/?q=classroom+children&f=license%3A%22Creative+Commons+0%22"
          grep -oE 'previews/[^"]+' fs.html | head -5; grep -oE '/people/[^/]+/sounds/[0-9]+/' fs.html | sort -u | head -10; head -c 600 fs.html
          curl -s -o /dev/null -w "api no token: %{http_code}\n" "https://freesound.org/apiv2/search/text/?query=classroom"
      - name: Wikimedia Commons audio
        run: |
          for q in "classroom" "school children" "children talking" "children playground" "school corridor" "school bell" "pupils" "chatter children" "crowd children" "kindergarten"; do echo "== $q"; curl -s "https://commons.wikimedia.org/w/api.php?action=query&generator=search&gsrnamespace=6&gsrsearch=$(python3 -c "import urllib.parse,sys;print(urllib.parse.quote(sys.argv[1]))" "$q filetype:audio")&gsrlimit=12&prop=imageinfo&iiprop=url|size|extmetadata&iiextmetadatafilter=LicenseShortName|Artist&format=json" | python3 -c "
          import json,sys
          d=json.load(sys.stdin).get('query',{}).get('pages',{})
          for p in d.values():
              ii=p['imageinfo'][0]; md=ii.get('extmetadata',{})
              print(' ',p['title'][:70],'|',md.get('LicenseShortName',{}).get('value'),'|',round(ii['size']/1e6,1),'MB')"; done
      - name: HF audio datasets with freesound clips
        run: |
          for q in FSD50K freesound "school ambience" "classroom audio"; do echo "== $q"; curl -s "https://huggingface.co/api/datasets?search=$(python3 -c "import urllib.parse,sys;print(urllib.parse.quote(sys.argv[1]))" "$q")&limit=10&full=true" | python3 -c "
          import json,sys
          for m in json.load(sys.stdin): print(' ',m['id'],m.get('downloads'),[t for t in m.get('tags',[]) if t.startswith('license:')])"; done
