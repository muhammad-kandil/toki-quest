name: audio-discover
on: workflow_dispatch
jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - name: Arabic + English voices on Hugging Face (piper)
        run: |
          curl -s "https://huggingface.co/api/models/rhasspy/piper-voices/tree/main/ar" | python3 -c "import json,sys;[print(x['path']) for x in json.load(sys.stdin)]"
          curl -s "https://huggingface.co/api/models/rhasspy/piper-voices/tree/main/ar/ar_JO" | python3 -c "import json,sys;[print(x['path']) for x in json.load(sys.stdin)]"
          curl -s "https://huggingface.co/rhasspy/piper-voices/raw/main/ar/ar_JO/kareem/medium/MODEL_CARD" | head -30
      - name: Other Arabic TTS on HF (permissive)
        run: |
          for q in arabic-tts "tts ar" "piper ar" "kokoro arabic" "vits arabic" "arabic female tts"; do echo "== $q"; curl -s "https://huggingface.co/api/models?search=$(python3 -c "import urllib.parse,sys;print(urllib.parse.quote(sys.argv[1]))" "$q")&pipeline_tag=text-to-speech&sort=downloads&limit=15&full=true" | python3 -c "
          import json,sys
          for m in json.load(sys.stdin):
              lic=[t for t in m.get('tags',[]) if t.startswith('license:')]
              print(' ',m['id'],m.get('downloads'),lic)"; done
      - name: Kokoro reachable
        run: curl -sI https://huggingface.co/onnx-community/Kokoro-82M-v1.0-ONNX/resolve/main/onnx/model_q8f16.onnx | head -3; curl -s -o /dev/null -w "%{http_code}\n" -L https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0/voices-v1.0.bin
      - name: Freesound CC0 search (HTML)
        run: |
          for q in "classroom children" "classroom ambience" "school children talking" "students group work" "school corridor" "school playground" "pencil writing classroom" "quiet classroom" "staff room" "school bell"; do
            echo "== $q"
            curl -sL -A "Mozilla/5.0" "https://freesound.org/search/?q=$(python3 -c "import urllib.parse,sys;print(urllib.parse.quote(sys.argv[1]))" "$q")&f=license:%22Creative+Commons+0%22&s=Downloads+desc" | grep -oE 'https://cdn.freesound.org/previews/[0-9]+/[0-9]+_[0-9]+-hq\.mp3' | sort -u | head -6
          done
      - name: BigSoundBank + Wikimedia
        run: |
          curl -sL -A "Mozilla/5.0" "https://bigsoundbank.com/search?q=classroom" | grep -oE 'href="[^"]*(classroom|school|children)[^"]*"' | sort -u | head -15
          curl -s "https://commons.wikimedia.org/w/api.php?action=query&list=search&srnamespace=6&srsearch=classroom%20ambience%20filetype:audio&format=json&srlimit=15" | python3 -c "import json,sys;[print(x['title']) for x in json.load(sys.stdin)['query']['search']]"
