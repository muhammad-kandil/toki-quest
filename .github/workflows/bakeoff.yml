name: Voice bake-off
on:
  workflow_dispatch:
    inputs:
      engines:
        description: "Engines to run (comma list): baseline,chatterbox,qwen,gemini"
        default: "gemini"
permissions: { contents: write }
concurrency: { group: bakeoff, cancel-in-progress: true }
jobs:
  bake:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - name: Base tools + current voices
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg espeak-ng >/dev/null
          pip install -q numpy soundfile jiwer faster-whisper kokoro-onnx piper-tts
          mkdir -p models && cd models
          curl -sSLO https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0/kokoro-v1.0.onnx
          curl -sSLO https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0/voices-v1.0.bin
          curl -sSLO https://huggingface.co/vadimbelsky/arabic-emirati-female-piper/resolve/main/arabic-emirati-female-model.onnx
          curl -sSLO https://huggingface.co/vadimbelsky/arabic-emirati-female-piper/resolve/main/arabic-emirati-female-model.onnx.json
          curl -sSLO https://huggingface.co/rhasspy/piper-voices/resolve/main/ar/ar_JO/kareem/medium/ar_JO-kareem-medium.onnx
          curl -sSLO https://huggingface.co/rhasspy/piper-voices/resolve/main/ar/ar_JO/kareem/medium/ar_JO-kareem-medium.onnx.json
      - name: Keep earlier bake-off results
        run: git fetch -q origin bakeoff && git checkout origin/bakeoff -- bakeoff || true
      - if: contains(inputs.engines, 'baseline')
        run: python tools/audio/bakeoff.py --engine baseline
      - name: Gemini (the engine behind Vids voice-overs)
        if: contains(inputs.engines, 'gemini')
        env: { GEMINI_API_KEY: "${{ secrets.GEMINI_API_KEY }}" }
        run: python tools/audio/bakeoff.py --engine gemini
      - name: Chatterbox (MIT)
        if: contains(inputs.engines, 'chatterbox')
        continue-on-error: true
        run: |
          pip install -q chatterbox-tts
          python tools/audio/bakeoff.py --engine chatterbox
      - name: Qwen3-TTS (Apache-2.0)
        if: contains(inputs.engines, 'qwen')
        continue-on-error: true
        run: |
          pip install -q qwen-tts
          python tools/audio/bakeoff.py --engine qwen
      - name: Publish to the bakeoff branch
        if: always()
        run: |
          git config user.name "toki-audio[bot]"; git config user.email "toki-audio@users.noreply.github.com"
          git checkout -B bakeoff
          git add -f bakeoff
          git commit -qm "voice bake-off ${{ github.run_id }}" || true
          git push -f -q origin bakeoff
