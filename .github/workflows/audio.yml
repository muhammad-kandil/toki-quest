name: Render audio (voices + room recordings + music)
on:
  workflow_dispatch:
    inputs:
      voice:
        description: "Render voices (en,ar | en | ar | none)"
        default: "en,ar"
      ambience:
        description: "Fetch room recordings (all | none | comma list of beds)"
        default: "all"
      items:
        description: "Fetch per-room item sounds (all | none | comma list of assets in items.json)"
        default: "none"
      redo:
        description: "Re-render clips whose text matches this regex (e.g. Ms\\.)"
        default: ""
      redo_slots:
        description: "Re-render every clip of these voice slots (e.g. narrator)"
        default: ""
      engine:
        description: "Voice engine: gemini (needs the GEMINI_API_KEY secret) or local (Kokoro/Piper)"
        default: "gemini"
      force:
        description: "Re-render every voice clip"
        type: boolean
        default: false
      music:
        description: "Compose and render the score (tools/audio/music/compose.py)"
        type: boolean
        default: false
permissions:
  contents: write
  actions: write
concurrency: { group: audio, cancel-in-progress: false }
jobs:
  script:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npx vite-node tools/audio/export-script.ts
      - uses: actions/upload-artifact@v4
        with: { name: script, path: tools/audio/out/script.json }

  voice:
    needs: script
    if: inputs.voice != 'none'
    strategy:
      fail-fast: false
      matrix:
        lang: [en, ar]
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
        if: contains(inputs.voice, matrix.lang)
      - uses: actions/download-artifact@v4
        if: contains(inputs.voice, matrix.lang)
        with: { name: script, path: tools/audio/out }
      - uses: actions/setup-python@v5
        if: contains(inputs.voice, matrix.lang)
        with: { python-version: "3.11" }
      - name: Install
        if: contains(inputs.voice, matrix.lang)
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg espeak-ng >/dev/null
          pip install -q numpy soundfile jiwer faster-whisper num2words
          if [ "${{ inputs.engine }}" = local ]; then
            if [ "${{ matrix.lang }}" = en ]; then pip install -q kokoro-onnx; else pip install -q piper-tts onnxruntime tqdm && pip install -q --no-deps catt-tashkeel; fi
          fi
      - name: Models
        if: contains(inputs.voice, matrix.lang) && inputs.engine == 'local'
        run: |
          mkdir -p models && cd models
          if [ "${{ matrix.lang }}" = en ]; then
            curl -sSLO https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0/kokoro-v1.0.onnx
            curl -sSLO https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0/voices-v1.0.bin
          else
            curl -sSLO https://huggingface.co/vadimbelsky/arabic-emirati-female-piper/resolve/main/arabic-emirati-female-model.onnx
            curl -sSLO https://huggingface.co/vadimbelsky/arabic-emirati-female-piper/resolve/main/arabic-emirati-female-model.onnx.json
            curl -sSLO https://huggingface.co/rhasspy/piper-voices/resolve/main/ar/ar_JO/kareem/medium/ar_JO-kareem-medium.onnx
            curl -sSLO https://huggingface.co/rhasspy/piper-voices/resolve/main/ar/ar_JO/kareem/medium/ar_JO-kareem-medium.onnx.json
          fi
          ls -la
      - name: Render + listen back
        if: contains(inputs.voice, matrix.lang)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_TTS_MODEL: ${{ vars.GEMINI_TTS_MODEL }}
        run: python tools/audio/render_voice.py --engine ${{ inputs.engine }} --budget-min 120 --lang ${{ matrix.lang }} --models models --out public/audio/voice ${{ inputs.force && '--force' || '' }} ${{ inputs.redo != '' && format('--redo "{0}"', inputs.redo) || '' }} ${{ inputs.redo_slots != '' && format('--redo-slots {0}', inputs.redo_slots) || '' }}
      - uses: actions/upload-artifact@v4
        if: contains(inputs.voice, matrix.lang)
        with:
          name: voice-${{ matrix.lang }}
          path: |
            public/audio/voice/${{ matrix.lang }}
            tools/audio/out/render-${{ matrix.lang }}.json

  ambience:
    if: inputs.ambience != 'none'
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg >/dev/null
          pip install -q torch --index-url https://download.pytorch.org/whl/cpu
          pip install -q numpy soundfile transformers
      - run: python tools/audio/ambience.py --out public/audio/amb ${{ inputs.ambience != 'all' && format('--only {0}', inputs.ambience) || '' }}
      - uses: actions/upload-artifact@v4
        with:
          name: ambience
          path: |
            public/audio/amb
            tools/audio/out/ambience-report.md

  items:
    if: inputs.items != 'none' && inputs.items != ''
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg >/dev/null
          pip install -q torch --index-url https://download.pytorch.org/whl/cpu
          pip install -q numpy soundfile transformers
      - run: python tools/audio/items.py --out public/audio/items ${{ inputs.items != 'all' && format('--only {0}', inputs.items) || '' }}
      - uses: actions/upload-artifact@v4
        with:
          name: items
          path: |
            public/audio/items
            tools/audio/out/items-report.md

  music:
    if: inputs.music
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - name: Install FluidSynth + FluidR3_GM (MIT)
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fluidsynth fluid-soundfont-gm >/dev/null
          ls -la /usr/share/sounds/sf2/
          pip install -q numpy soundfile pretty_midi pyfluidsynth pyloudnorm
      - run: python tools/audio/music/compose.py --sf2 /usr/share/sounds/sf2/FluidR3_GM.sf2 --out public/audio/music
      - uses: actions/upload-artifact@v4
        with: { name: music, path: public/audio/music }

  commit:
    needs: [voice, ambience, items, music]
    if: always() && !cancelled()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { path: art }
      - name: Place files
        run: |
          set -x
          for l in en ar; do
            if [ -d art/voice-$l/public/audio/voice/$l ]; then rm -rf public/audio/voice/$l; mkdir -p public/audio/voice; cp -r art/voice-$l/public/audio/voice/$l public/audio/voice/$l; mkdir -p tools/audio/reports; cp art/voice-$l/tools/audio/out/render-$l.json tools/audio/reports/; fi
          done
          if [ -d art/ambience/public/audio/amb ]; then mkdir -p public/audio/amb; cp -r art/ambience/public/audio/amb/. public/audio/amb/; mkdir -p tools/audio/reports; cp art/ambience/tools/audio/out/ambience-report.md tools/audio/reports/; fi
          if [ -d art/items/public/audio/items ]; then mkdir -p public/audio/items; cp -r art/items/public/audio/items/. public/audio/items/; mkdir -p tools/audio/reports; cp art/items/tools/audio/out/items-report.md tools/audio/reports/; fi
          if [ -d art/music ]; then rm -rf public/audio/music; mkdir -p public/audio; cp -r art/music public/audio/music; fi
          du -sh public/audio/* || true
      - name: Commit
        run: |
          git config user.name "toki-audio[bot]"; git config user.email "toki-audio@users.noreply.github.com"
          git add public/audio tools/audio/reports
          git diff --cached --quiet && { echo "no audio changes"; exit 0; }
          git commit -qm "audio: render voices, room recordings and music (workflow run ${{ github.run_id }})"
          git pull --rebase -q origin main && git push -q origin main
          gh workflow run deploy.yml --ref main
        env: { GH_TOKEN: "${{ github.token }}" }
