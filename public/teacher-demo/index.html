<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<title>Different Needs, Same Classroom</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Inter:wght@400;500;600&display=swap">
<style>
/* Layout: one phone-width game column; painted classroom on top, decision panel below; loop rail pinned above. Single committed night-indigo look. */
:root{
  --bg:#17122b; --panel:#221a3f; --panel-2:#2c2350; --line:#3d3366;
  --ink:#f6f2ff; --muted:#b9aedb; --teal:#2ad7be; --orange:#f5a623; --rose:#ff7a8a; --blue:#7cb4ff;
  --display:"Baloo 2", "Trebuchet MS", system-ui, sans-serif; --body:Inter, system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px 40px}
.app{max-width:440px;margin:0 auto;display:flex;flex-direction:column;gap:12px}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--orange);outline-offset:2px}
h1,h2,h3{font-family:var(--display);line-height:1.15;margin:0;text-wrap:balance}

/* loop rail */
.rail{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.rail div{font-size:10.5px;letter-spacing:.02em;text-align:center;color:var(--muted);padding-top:8px;border-top:4px solid var(--line);transition:.3s}
.rail div.on{color:var(--ink);border-color:var(--teal)}
.rail div.now{color:var(--orange);border-color:var(--orange);font-weight:600}

.top{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.top h1{font-size:22px}
.eyebrow{font-size:11px;text-transform:uppercase;letter-spacing:.12em;color:var(--teal);font-weight:600}
.clock{font-family:var(--display);font-size:18px;color:var(--orange);font-variant-numeric:tabular-nums;white-space:nowrap}

/* scene */
.scene{position:relative;width:100%;aspect-ratio:720/1080;max-width:100%;border-radius:18px;overflow:hidden;background:#000}
.scene img.bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:filter .4s}
.scene.dim img.bg{filter:brightness(.55)}
.caption{position:absolute;left:0;right:0;bottom:0;padding:48px 18px 18px;background:linear-gradient(transparent,rgba(10,6,24,.92));font-size:16px}
.caption small{display:block;color:var(--muted);font-size:12px;margin-top:6px}
.bubble{position:absolute;background:#fff8ec;color:#231b45;border-radius:14px;padding:7px 10px;font-size:12.5px;font-weight:600;max-width:46%;box-shadow:0 6px 18px rgba(0,0,0,.35);animation:pop .35s ease-out both}
.bubble b{display:block;font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;color:#6b5aa8}
@keyframes pop{from{transform:scale(.7);opacity:0}to{transform:none;opacity:1}}

.hot{position:absolute;transform:translate(-50%,-50%);border:none;background:none;padding:0;display:flex;flex-direction:column;align-items:center;gap:3px}
.hot .ring{width:46px;height:46px;border-radius:50%;border:3px solid var(--st,#fff);background:rgba(23,18,43,.55);display:grid;place-items:center;font-family:var(--display);font-size:18px;box-shadow:0 0 0 0 var(--st);}
.hot.alert .ring{animation:pulse 1.3s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--st) 70%,transparent)}100%{box-shadow:0 0 0 16px transparent}}
.hot .tag{font-size:11px;font-weight:600;background:rgba(23,18,43,.8);padding:1px 7px;border-radius:8px;white-space:nowrap}
.hot .flag{position:absolute;top:-10px;right:-12px;background:var(--orange);color:#231b45;font-weight:800;font-size:13px;width:22px;height:22px;border-radius:50%;display:grid;place-items:center}
.hot.obj .ring{border-style:dashed;width:40px;height:40px;font-size:16px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* panel */
.panel{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:12px}
.panel h2{font-size:20px}
.kind{display:inline-block;font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;padding:2px 9px;border-radius:999px;background:var(--panel-2);color:var(--muted)}
.kind.help{color:var(--rose)} .kind.early{color:var(--teal)} .kind.low{color:var(--blue)} .kind.unexp{color:var(--orange)} .kind.new{color:var(--teal)}
.opts{display:grid;gap:8px}
.opt{display:flex;justify-content:space-between;align-items:center;gap:10px;text-align:left;background:var(--panel-2);border:1px solid var(--line);border-radius:14px;padding:12px 14px;transition:.15s}
.opt:hover{border-color:var(--teal);transform:translateY(-1px)}
.opt strong{font-family:var(--display);font-size:17px;display:block;line-height:1.2}
.opt span{font-size:13px;color:var(--muted)}
.opt em{font-style:normal;font-size:12px;color:var(--orange);white-space:nowrap}
.hint{font-size:13px;color:var(--muted)}
.result{border-left:4px solid var(--st,var(--teal));padding:4px 0 4px 12px}
.result h3{font-size:17px}
.cta{align-self:flex-start;background:var(--teal);color:#14102a;border:none;border-radius:999px;padding:10px 20px;font-weight:700;font-family:var(--display);font-size:16px}
.cta.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.row{display:flex;gap:8px;flex-wrap:wrap}

/* resource card */
.res{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:start;background:linear-gradient(135deg,#3b2a78,#2c2350);border:1px solid #5a47a8;border-radius:16px;padding:14px}
.res .ico{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;font-family:var(--display);font-size:20px;background:var(--stage,#f5a623);color:#1b1533}
.res b{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--orange)}
.res h3{font-size:18px;margin:2px 0 4px}
.res p{margin:0;font-size:13.5px;color:#e5ddff}
.res .monday{margin-top:8px;font-size:13px;color:var(--teal)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--orange);color:#231b45;font-weight:700;padding:10px 16px;border-radius:999px;font-size:14px;box-shadow:0 8px 24px rgba(0,0,0,.4);animation:pop .3s both;z-index:20;max-width:calc(100% - 32px);text-align:center}

/* summary */
.kids{display:grid;gap:8px}
.kid{display:grid;grid-template-columns:44px 1fr;gap:10px;align-items:center;background:var(--panel-2);border-radius:14px;padding:10px}
.kid .ring{width:40px;height:40px;border-radius:50%;border:3px solid var(--st);display:grid;place-items:center;font-family:var(--display)}
.kid p{margin:0;font-size:13.5px} .kid strong{font-size:14px}
.path{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:12.5px}
.path span{background:var(--panel-2);border:1px solid var(--line);border-radius:999px;padding:3px 10px}
.path i{color:var(--muted);font-style:normal}

.post{background:#f3f6fb;color:#1c2333;border-radius:14px;padding:10px 12px;font-size:13.5px}
.post b{color:#2a7bd1;font-size:12.5px} .post small{color:#7a8597}
.tg{display:flex;align-items:center;gap:10px}
.tg .av{width:38px;height:38px;border-radius:50%;background:#2aa3e0;display:grid;place-items:center;font-weight:800;color:#fff}
textarea{width:100%;min-height:84px;border-radius:12px;border:1px solid var(--line);background:var(--panel-2);color:var(--ink);font:inherit;padding:10px}

.badge{display:grid;place-items:center;text-align:center;gap:6px;padding:10px 0}
.medal{width:120px;height:120px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#ffd27a,#f5a623 55%,#b86f00);display:grid;place-items:center;font-family:var(--display);font-size:42px;color:#3b2a78;box-shadow:0 10px 30px rgba(245,166,35,.35);animation:pop .5s both}
.map{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.node{aspect-ratio:1;border-radius:16px;background:var(--panel-2);border:1px solid var(--line);display:grid;place-items:center;text-align:center;padding:6px;font-size:11.5px;color:var(--muted)}
.node.done{background:color-mix(in srgb,var(--teal) 25%,var(--panel-2));color:var(--ink);border-color:var(--teal)}
.node.next{border:2px solid var(--orange);color:var(--ink);animation:pulse2 1.6s infinite}
@keyframes pulse2{50%{transform:scale(1.04)}}
.node b{font-family:var(--display);font-size:20px;display:block;color:inherit}
.note{font-size:11.5px;color:var(--muted);text-align:center}
</style>
</head><body>

<div class="app">
  <div class="rail" id="rail"></div>
  <div class="top"><div><div class="eyebrow">Adventure 1 · Grade 5 Math</div><h1>Different Needs, Same Classroom</h1></div><div class="clock" id="clock"></div></div>
  <div class="scene" id="scene"><img class="bg" src="img/classroom.jpg" alt="Ms. Mariam's classroom: groups of students at tables, Ms. Mariam standing by the window"></div>
  <div class="panel" id="panel"></div>
  <p class="note">Demo adventure. Alef resource names and descriptions are placeholders for the Alef team to confirm.</p>
</div>

<script>
const LOOP=['Watch','Decide','Discover','Challenge','Community','Reward','Unlock'];
const LESSON=40;
const $=s=>document.querySelector(s);
const STAGE={launch:{name:'Launch',c:'#7cb4ff'},facil:{name:'Facilitate & Synthesise',c:'#2ad7be'},extend:{name:'Extend & Assess',c:'#f5a623'}};
const RES={
  worked:{ico:'✎',stage:'facil',title:'Worked example',p:'A step-by-step model the student follows beside you, then tries alone.',monday:'Try it Monday: model one problem, then hand her the pen for the next.'},
  explain:{ico:'?',stage:'facil',title:'Explain-your-thinking prompt',p:'Ask the student to talk through her answer before you correct anything. The mistake shows itself.',monday:'Try it Monday: "Show me how you got that" before "That’s wrong".'},
  stretch:{ico:'↗',stage:'extend',title:'Extension task',p:'A harder problem on the same idea, so finishing early leads to deeper work, not busywork.',monday:'Try it Monday: keep one "go further" problem ready for every lesson.'},
  roles:{ico:'◎',stage:'facil',title:'Team roles',p:'Every student at the table gets a job: explainer, checker, reporter. Nobody can sit out.',monday:'Try it Monday: give the quietest student the reporter role.'},
  game:{ico:'▶',stage:'launch',title:'Launch game',p:'A short game that pulls the whole class into the lesson question.',monday:'Try it Monday: open with a 3-minute game, then ask "why?" about one answer.'},
  targeted:{ico:'◆',stage:'extend',title:'Targeted practice set',p:'Practice chosen for the exact mistake the student made, not a generic worksheet.',monday:'Try it Monday: group your exit-ticket mistakes, then pick one practice set per group.'},
  reteach:{ico:'↺',stage:'facil',title:'Small-group reteach',p:'Pull the students who are stuck for five minutes while the rest keep working.',monday:'Try it Monday: plan a 5-minute reteach table into every lesson.'},
  offline:{ico:'▤',stage:'launch',title:'Printed backup task',p:'The same task on paper, so the lesson keeps going when the tablets don’t.',monday:'Try it Monday: print one copy of the main task per table, just in case.'}
};
const KIDS={
  sara:{name:'Sara',x:71,y:52,u:0,e:2},
  ahmed:{name:'Ahmed',x:57,y:50,u:3,e:1},
  omar:{name:'Omar',x:21,y:44,u:1,e:0}
};
const col=k=>{const s=KIDS[k].u+KIDS[k].e; return s>=5?'#2ad7be':s>=3?'#f5a623':'#ff7a8a'};

let S;
function reset(){
  S={t:0,step:0,seen:new Set([0]),queue:[],done:new Set(),found:[],path:[],flags:{},active:null,tabletAt:22,outcome:{}};
  Object.assign(KIDS.sara,{u:0,e:2});Object.assign(KIDS.ahmed,{u:3,e:1});Object.assign(KIDS.omar,{u:1,e:0});
}
function rail(){ $('#rail').innerHTML=LOOP.map((l,i)=>`<div class="${i===S.step?'now':S.seen.has(i)?'on':''}">${l}</div>`).join(''); }
function setStep(i){S.step=i;S.seen.add(i);rail();}
function clock(){ $('#clock').textContent=S.t>0||S.phase==='sim'?`${Math.min(S.t,LESSON)}:00 / ${LESSON}:00`:''; }
function toast(t){const d=document.createElement('div');d.className='toast';d.textContent=t;document.body.appendChild(d);setTimeout(()=>d.remove(),2600);}

/* ---------- events (the branching graph) ---------- */
const EV={
  sara:{who:'sara',kind:['help','Student needs help'],q:'“Miss, I still don’t understand.”',ask:'Sara is stuck on adding fractions. What do you do?',
    opts:[
      {label:'Need help',sub:'Support',res:'worked',cost:5,go:()=>S.flags.peekedSara?'misconception':'ready'},
      {label:'See why',sub:'Explanation',res:'explain',cost:4,go:()=> 'misconception'},
      {label:'Move on',sub:'Continue',cost:0,go:()=> 'persists'}]},
  ahmed:{who:'ahmed',kind:['early','Early finisher'],q:'“Miss, I’ve already finished!”',ask:'Ahmed finished all eight problems in six minutes.',
    opts:[
      {label:'Go further',sub:'Practice',res:'stretch',cost:2,go:()=> 'ahmedDeep'},
      {label:'Help a classmate',sub:'Teams',res:'roles',cost:2,go:()=> 'ahmedPeer'}]},
  omar:{who:'omar',kind:['low','Low participation'],q:'“Miss, what are we doing today?”',ask:'Omar hasn’t written anything. His table is working around him.',
    opts:[
      {label:'Give him a role',sub:'Teams',res:'roles',cost:3,go:()=> 'omarRole'},
      {label:'Quick game',sub:'Game',res:'game',cost:4,go:()=> 'gameLoud'}]},
  tablet:{who:'tablet',kind:['unexp','Unexpected challenge'],q:'The class tablets just lost connection.',ask:'Half the class can’t see the task.',
    opts:[
      {label:'Switch to paper',sub:'Printed backup',res:'offline',cost:2,go:()=> 'paperOk'},
      {label:'Wait for Wi-Fi',sub:'Pause the class',cost:7,go:()=> 'waited'}]},
  /* follow-ups created by outcomes */
  enrich:{who:'sara',kind:['new','Enrichment challenge'],q:'“Can I try a harder one?”',ask:'Sara got the last three right. Keep her growing.',
    opts:[
      {label:'Harder problem',sub:'Extension task',res:'stretch',cost:2,go:()=> 'saraStretch'},
      {label:'Let her explain to Omar',sub:'Teams',res:'roles',cost:3,go:()=> 'saraTeaches'}]},
  targeted:{who:'sara',kind:['new','Targeted practice'],q:'Sara writes: 1/4 + 2/4 = 3/8',ask:'She adds the bottoms too. Which practice fits her mistake?',
    opts:[
      {label:'Fraction strips: same-size pieces',sub:'Targeted practice set',res:'targeted',cost:4,go:()=> 'fixed'},
      {label:'Ten more mixed problems',sub:'General worksheet',cost:5,go:()=> 'repeated'},
      {label:'Watch the video again',sub:'Replay',cost:4,go:()=> 'repeated'}]},
  intervene:{who:'sara',kind:['help','Intervention challenge'],q:'Sara and two others are still stuck.',ask:'It’s getting late in the lesson. How do you catch them up?',
    opts:[
      {label:'Pull them to a side table',sub:'Small-group reteach',res:'reteach',cost:5,go:()=> 'caughtUp'},
      {label:'Reteach the whole class',sub:'Whole class',cost:8,go:()=> 'wholeReteach'}]},
  peerAnswers:{who:'ahmed',kind:['unexp','Unexpected challenge'],q:'Ahmed is just telling Sara the answers.',ask:'Sara’s page is filling up, but is she learning?',
    opts:[
      {label:'"Ask her a question instead"',sub:'Coach the helper',res:'explain',cost:2,go:()=> 'goodPeer'},
      {label:'Let it go',sub:'Continue',cost:0,go:()=> 'copied'}]},
  loud:{who:'omar',kind:['unexp','Unexpected challenge'],q:'The game is loud. Two students are just guessing.',ask:'Omar is finally joining in, but some answers are guesses.',
    opts:[
      {label:'Pause: "Why that answer?"',sub:'Explain your thinking',res:'explain',cost:2,go:()=> 'gameFocused'},
      {label:'Keep playing',sub:'Continue',cost:3,go:()=> 'gameGuess'}]}
};
const OUT={
  ready:{st:'#2ad7be',h:'Sara is ready to progress',p:'She follows the model, then solves the next one alone.',fx:()=>bump('sara',2,1),next:['enrich',4]},
  misconception:{st:'#7cb4ff',h:'Misconception discovered',p:'As she talks, you hear it: she adds the denominators too.',fx:()=>{bump('sara',1,1);S.flags.mis=1},next:['targeted',2]},
  persists:{st:'#f5a623',h:'Difficulty persists',p:'Sara goes quiet and copies her neighbour’s first line.',fx:()=>bump('sara',0,-1),next:['intervene',9]},
  ahmedDeep:{st:'#2ad7be',h:'Ahmed is thinking hard',p:'The extension problem has him sketching diagrams.',fx:()=>bump('ahmed',0,2)},
  ahmedPeer:{st:'#f5a623',h:'Ahmed moves next to Sara',p:'He’s happy to help. A few minutes later, you look over…',fx:()=>bump('ahmed',0,1),next:['peerAnswers',3]},
  omarRole:{st:'#2ad7be',h:'Omar is the reporter',p:'He has to tell the class what his table found, so he starts listening.',fx:()=>bump('omar',1,3)},
  gameLoud:{st:'#f5a623',h:'The class lights up',p:'Everyone is in, Omar too. Then the noise rises.',fx:()=>{bump('omar',0,3);bump('ahmed',0,1)},next:['loud',2]},
  paperOk:{st:'#2ad7be',h:'The lesson keeps going',p:'Paper copies come out in a minute; nobody loses the thread.',fx:()=>{}},
  waited:{st:'#ff7a8a',h:'Seven minutes lost',p:'The Wi-Fi comes back, but the class has drifted.',fx:()=>{bump('omar',0,-1);bump('ahmed',0,-1)}},
  saraStretch:{st:'#2ad7be',h:'Sara is stretching',p:'She tackles unlike denominators and explains her drawing.',fx:()=>bump('sara',1,1)},
  saraTeaches:{st:'#2ad7be',h:'Sara explains it to Omar',p:'Teaching it locks it in for her, and Omar gets it in kid language.',fx:()=>{bump('sara',1,1);bump('omar',1,1)}},
  fixed:{st:'#2ad7be',h:'The strips do it',p:'"Oh! The pieces stay quarters." She fixes her last three answers.',fx:()=>bump('sara',2,1)},
  repeated:{st:'#ff7a8a',h:'Same mistake, ten more times',p:'More practice of the wrong idea makes it stick harder.',fx:()=>bump('sara',0,-1)},
  caughtUp:{st:'#2ad7be',h:'Three students catch up',p:'Five minutes at the side table, while everyone else keeps working.',fx:()=>bump('sara',2,1)},
  wholeReteach:{st:'#f5a623',h:'Sara gets it; Ahmed checks out',p:'The reteach works for the three, but costs the rest of the class.',fx:()=>{bump('sara',2,0);bump('ahmed',0,-2)}},
  goodPeer:{st:'#2ad7be',h:'Ahmed becomes a real helper',p:'"Why do the quarters stay quarters?" Now they’re both thinking.',fx:()=>{bump('sara',2,1);bump('ahmed',0,1)}},
  copied:{st:'#ff7a8a',h:'Sara has answers, not understanding',p:'Her page is full. On the exit ticket, she’s stuck again.',fx:()=>bump('sara',0,-1)},
  gameFocused:{st:'#2ad7be',h:'From guessing to reasoning',p:'One "why" turns the game into a real discussion. Omar explains his pick.',fx:()=>bump('omar',2,0)},
  gameGuess:{st:'#f5a623',h:'Fun, but shallow',p:'Everyone played. Few could say why their answer was right.',fx:()=>bump('omar',0,0)}
};
function bump(k,u,e){const K=KIDS[k];K.u=Math.max(0,Math.min(3,K.u+u));K.e=Math.max(0,Math.min(3,K.e+e));}

/* ---------- phases ---------- */
const WATCH=[
  {cap:'Ms. Mariam’s Grade 5 class. Today: adding fractions. Twenty-four students, forty minutes.'},
  {cap:'One classroom. Different needs. And only so much time.',bub:true},
  {cap:'You are Ms. Mariam. Tap a student to respond. There’s no single right path: every choice changes what happens next.'}
];
function watch(i){
  S.phase='watch';setStep(0);clock();
  const sc=$('#scene');sc.querySelectorAll('.caption,.bubble,.hot').forEach(n=>n.remove());sc.classList.add('dim');
  const c=document.createElement('div');c.className='caption';c.innerHTML=WATCH[i].cap+`<small>${i+1} of ${WATCH.length}</small>`;sc.appendChild(c);
  if(WATCH[i].bub){
    [['ahmed','Ahmed','Miss, I’ve already finished!'],['sara','Sara','Miss, I still don’t understand.'],['omar','Omar','Miss, what are we doing today?']].forEach(([k,n,t],j)=>{
      const b=document.createElement('div');b.className='bubble';const K=KIDS[k];
      b.style.left=Math.min(Math.max(K.x-20,2),52)+'%';b.style.top=(K.y-24+(j*3))+'%';b.style.animationDelay=(j*.35)+'s';b.innerHTML=`<b>${n}</b>${t}`;sc.appendChild(b);});
  }
  $('#panel').innerHTML=`<p class="hint">${i===0?'A demo adventure for teachers.':'Watch the lesson begin.'}</p><button class="cta" id="nx">${i<WATCH.length-1?'Next':'Start the lesson'}</button>`;
  $('#nx').onclick=()=> i<WATCH.length-1?watch(i+1):startSim();
}
function startSim(){
  S.phase='sim';S.t=3;setStep(1);
  S.queue=[{id:'sara',at:3},{id:'ahmed',at:6},{id:'omar',at:9},{id:'tablet',at:S.tabletAt}];
  $('#scene').classList.remove('dim');draw();idle();
}
function live(){return S.queue.filter(q=>q.at<=S.t&&!S.done.has(q.key||q.id));}
function draw(){
  clock();const sc=$('#scene');sc.querySelectorAll('.caption,.bubble,.hot').forEach(n=>n.remove());
  const L=live();
  for(const k in KIDS){const K=KIDS[k];const ev=L.find(q=>EV[q.id].who===k);
    const b=document.createElement('button');b.className='hot'+(ev?' alert':'');b.style.left=K.x+'%';b.style.top=K.y+'%';b.style.setProperty('--st',col(k));
    b.innerHTML=`<span class="ring">${K.name[0]}</span><span class="tag">${K.name}</span>${ev?'<span class="flag">!</span>':''}`;
    b.setAttribute('aria-label',K.name+(ev?': needs you':''));
    b.onclick=()=> ev?openEv(ev):peek(k);sc.appendChild(b);}
  const tab=L.find(q=>q.id==='tablet');
  const t=document.createElement('button');t.className='hot obj'+(tab?' alert':'');t.style.left='90%';t.style.top='70%';t.style.setProperty('--st',tab?'#f5a623':'#b9aedb');
  t.innerHTML=`<span class="ring">▣</span><span class="tag">Tablets</span>${tab?'<span class="flag">!</span>':''}`;t.onclick=()=> tab?openEv(tab):toast('Tablets are working. The task is on screen.');sc.appendChild(t);
  const m=document.createElement('button');m.className='hot obj';m.style.left='82%';m.style.top='30%';m.style.setProperty('--st','#2ad7be');
  m.innerHTML=`<span class="ring">≡</span><span class="tag">Lesson plan</span>`;m.onclick=()=>toast('Plan: launch 5 min · practice 20 min · exit ticket 5 min.');sc.appendChild(m);
}
function peek(k){
  const K=KIDS[k];
  if(k==='sara'&&!S.flags.peekedSara&&!S.done.has('sara')){S.flags.peekedSara=1;toast('Sara’s page: 1/4 + 2/4 = 3/8. Interesting…');return;}
  const msg={sara:'Sara is working.',ahmed:'Ahmed is working.',omar:'Omar is at his table.'}[k];toast(msg);
}
function idle(){
  const L=live();
  if(!L.length){
    const nxt=S.queue.filter(q=>!S.done.has(q.key||q.id)&&q.at>S.t).sort((a,b)=>a.at-b.at)[0];
    if(!nxt||S.t>=LESSON){return endLesson();}
    $('#panel').innerHTML=`<p class="hint">The class is working. Keep watching, or let time run to what happens next.</p><div class="row"><button class="cta" id="adv">Let the lesson run</button></div>`;
    $('#adv').onclick=()=>{S.t=Math.min(LESSON,nxt.at);draw();idle();};return;
  }
  const names=L.map(q=>EV[q.id].who==='tablet'?'the tablets':KIDS[EV[q.id].who].name);
  $('#panel').innerHTML=`<h2>${L.length>1?L.length+' things need you':'Something needs you'}</h2><p class="hint">Tap ${names.join(', ').replace(/, ([^,]*)$/,' or $1')} in the classroom. You choose the order.</p>`;
}
function openEv(q){
  const E=EV[q.id];S.active=q;if(E.kind[0]==='unexp'||['enrich','targeted','intervene'].includes(q.id))setStep(3);else setStep(1);
  const who=E.who==='tablet'?'Tablets':KIDS[E.who].name;
  $('#panel').innerHTML=`<span class="kind ${E.kind[0]}">${E.kind[1]}</span><h2>${who}: ${E.q}</h2><p class="hint">${E.ask}</p>
   <div class="opts">${E.opts.map((o,i)=>`<button class="opt" data-i="${i}"><div><strong>${o.label}</strong><span>${o.sub}</span></div><em>${o.cost?o.cost+' min':'0 min'}</em></button>`).join('')}</div>`;
  $('#panel').querySelectorAll('.opt').forEach(b=>b.onclick=()=>choose(q,E.opts[+b.dataset.i]));
  $('#panel').scrollIntoView({behavior:'smooth',block:'nearest'});
}
function choose(q,o){
  const key=o.go();const R=OUT[key];S.done.add(q.key||q.id);S.t+=o.cost;R.fx();
  S.path.push({ev:EV[q.id].kind[1],pick:o.label,out:R.h,st:R.st});
  let resHtml='';
  if(o.res&&!S.found.includes(o.res)){S.found.push(o.res);setStep(2);const r=RES[o.res];const st=STAGE[r.stage];
    resHtml=`<div class="res" style="--stage:${st.c}"><div class="ico">${r.ico}</div><div><b>New Alef resource · ${st.name}</b><h3>${r.title}</h3><p>${r.p}</p><div class="monday">${r.monday}</div></div></div>`;
    toast('Alef resource discovered: '+r.title);}
  if(R.next){const [id,delay]=R.next;S.queue.push({id,key:id,at:S.t+delay});}
  draw();
  $('#panel').innerHTML=`<div class="result" style="--st:${R.st}"><h3>${R.h}</h3><p class="hint">${R.p}</p></div>${resHtml}
    ${R.next?`<p class="hint">This choice opens a new moment later in the lesson.</p>`:''}<button class="cta" id="go">Back to the class</button>`;
  $('#go').onclick=()=>{if(S.t>=LESSON)return endLesson();draw();idle();};
}
function endLesson(){
  S.phase='end';S.t=LESSON;setStep(3);draw();
  $('#scene').classList.add('dim');
  const line=k=>{const K=KIDS[k];const s=K.u+K.e;return s>=5?'Left the lesson able to do it, and could explain why.':s>=3?'Partly there. Worth a check at the start of tomorrow.':'Left still stuck. Tomorrow starts with them.'};
  const missed=S.queue.filter(q=>!S.done.has(q.key||q.id)&&q.at<LESSON).map(q=>EV[q.id].kind[1]);
  $('#panel').innerHTML=`<span class="kind new">Exit ticket</span><h2>The bell rings. Where did everyone land?</h2>
   <div class="kids">${Object.keys(KIDS).map(k=>`<div class="kid" style="--st:${col(k)}"><div class="ring">${KIDS[k].name[0]}</div><div><strong>${KIDS[k].name}</strong><p>${line(k)}</p></div></div>`).join('')}</div>
   ${missed.length?`<p class="hint">Not reached before the bell: ${missed.join(', ')}.</p>`:''}
   <h3>Your path through this lesson</h3>
   <div class="path">${S.path.map((p,i)=>`${i?'<i>→</i>':''}<span style="border-color:${p.st}">${p.pick}</span>`).join('')}</div>
   <p class="hint">Another teacher would have taken a different path. Play again to see where the other branches lead.</p>
   <div class="row"><button class="cta" id="go">Next: the community</button><button class="cta ghost" id="again">Replay the lesson</button></div>`;
  $('#go').onclick=community;$('#again').onclick=()=>{reset();watch(2);};
}
function community(){
  setStep(4);const first=S.path[0];
  const mine=`In "Different Needs, Same Classroom" I started with ${first?first.ev.toLowerCase()+': '+first.pick.toLowerCase():'the class'}. ${S.found.length?'Resource I’ll try on Monday: '+RES[S.found[0]].title+'.':''}`;
  $('#panel').innerHTML=`<div class="tg"><div class="av">A</div><div><h2>Alef Teachers Community</h2><p class="hint">Topic: different needs, same classroom · optional</p></div></div>
   <div class="post"><b>Grade 5 teacher · Al Ain</b><br>I keep a "go further" card on every table. Early finishers grab it without asking. <small>· example post</small></div>
   <div class="post"><b>Math teacher · Abu Dhabi</b><br>"Show me how you got that" found more mistakes this week than any quiz did. <small>· example post</small></div>
   <label class="hint" for="share">Your move, ready to share:</label><textarea id="share">${mine}</textarea>
   <div class="row"><button class="cta" id="copy">Copy my post</button><button class="cta ghost" id="skip">Skip for now</button></div>
   <p class="hint">In the game, this opens the Alef Telegram community. The link goes here once Alef shares it.</p>`;
  $('#copy').onclick=async()=>{try{await navigator.clipboard.writeText($('#share').value);toast('Copied. Paste it in the community.');}catch(e){$('#share').select();toast('Selected. Copy it with your keyboard.');} };
  $('#skip').onclick=reward;
  document.getElementById('copy').addEventListener('click',()=>setTimeout(reward,1400));
}
function reward(){
  setStep(5);
  const all=Object.keys(KIDS).every(k=>KIDS[k].u+KIDS[k].e>=5);
  const B=all?{m:'★',n:'Every Learner In',w:'All three students left the lesson able to do it.'}:S.flags.mis?{m:'◆',n:'Misconception Hunter',w:'You found the real mistake behind "I don’t understand".'}:{m:'✎',n:'First Lesson Logged',w:'You saw three different needs and acted on them.'};
  $('#panel').innerHTML=`<div class="badge"><div class="medal">${B.m}</div><h2>${B.n}</h2><p class="hint">${B.w}</p></div>
   <h3>Added to your teaching toolkit</h3>
   ${S.found.length?S.found.map(k=>{const r=RES[k];const st=STAGE[r.stage];return `<div class="res" style="--stage:${st.c}"><div class="ico">${r.ico}</div><div><b>${st.name}</b><h3>${r.title}</h3><div class="monday">${r.monday}</div></div></div>`}).join(''):'<p class="hint">No resources used this time. Replay and try a different path to discover them.</p>'}
   <p class="hint">A new page in Ms. Mariam’s notebook: your path and what each student needed. No points, no timer: the toolkit grows with you.</p>
   <button class="cta" id="go">What happens next?</button>`;
  $('#go').onclick=unlock;
}
function unlock(){
  setStep(6);
  const tease=KIDS.omar.u+KIDS.omar.e>=5?'Omar spoke up today. Tomorrow, the quiet table across the room doesn’t.':'Omar barely spoke today, and he isn’t the only one.';
  const names=['Different Needs','The Quiet Table','The Group That Copies','Data Day','Mixed Abilities','Visit Week','The Hard Topic','End of Term'];
  $('#scene').classList.add('dim');
  $('#panel').innerHTML=`<span class="kind new">Next adventure unlocked</span><h2>The Quiet Table</h2><p class="hint">${tease}</p>
   <div class="map">${names.map((n,i)=>`<div class="node ${i===0?'done':i===1?'next':''}"><div><b>${i+1}</b>${n}</div></div>`).join('')}</div>
   <div class="row"><button class="cta" id="again">Replay Adventure 1</button></div>
   <p class="hint">End of the demo. Adventure 2 opens because the story moves on, not because a points bar filled up.</p>`;
  $('#again').onclick=()=>{reset();watch(0);};
}
reset();rail();watch(0);
</script>
<script>try{Telegram.WebApp.ready();Telegram.WebApp.expand()}catch(e){}</script>
