<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no" />
    <title>Toki's Coaching Quest</title>
  </head>
  <body>
    <div id="root">
      <!-- Shown until React mounts. If JS fails to run, the player sees this
           instead of a blank page — which also tells us "JS didn't run". -->
      <div style="display:flex;align-items:center;justify-content:center;min-height:100vh;font-family:system-ui,sans-serif;color:#452B74;">
        <div style="text-align:center;">
          <div style="font-size:18px;font-weight:700;">Loading Toki's Quest…</div>
          <div style="margin-top:8px;font-size:13px;color:#8a7fb0;">Just a moment</div>
        </div>
      </div>
    </div>
    <noscript>
      <div style="padding:24px;text-align:center;font-family:system-ui,sans-serif;">
        This game needs JavaScript enabled to play.
      </div>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
